name: Product API tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run product API tests
        run: python -m unittest product_api.test_product_api
      - name: Run composed-claim MLR activation test
        run: python -m unittest product_api.test_z_mlr_activation
      - name: Run Kaggle semantic smoke test
        run: python kaggle_semantic_smoke.py
